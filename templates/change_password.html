{% extends "base.html" %}
{% block title %}Change password — UDMM Research Workspace{% endblock %}
{% block content %}
<div class="form-page form-page-narrow">
    <div class="page-header"><h1>Change password</h1><p>Choose a new password for your workspace account.</p></div>
    <form method="POST" class="card">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group"><label for="current-password">Current password</label><input id="current-password" type="password" name="current_password" required autofocus autocomplete="current-password"></div>
        <div class="form-group"><label for="new-password">New password</label><input id="new-password" type="password" name="new_password" required autocomplete="new-password"></div>
        <div class="form-group"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" name="confirm_password" required autocomplete="new-password"></div>
        <div class="form-actions"><a href="/" class="btn">Cancel</a><button type="submit" class="btn btn-primary">Update password</button></div>
    </form>
</div>
{% endblock %}
