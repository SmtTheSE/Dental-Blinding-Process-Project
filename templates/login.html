{% extends "base.html" %}
{% block title %}Sign in — UDMM Research Workspace{% endblock %}
{% block content %}
<div class="login-container">
    <div class="login-heading"><img src="{{ url_for('static', filename='img/UDMM.jpeg', v='278e8117') }}" class="login-crest" alt="" width="34" height="52"><h1>Welcome back</h1><p>Sign in to continue to UDMM Research Workspace.</p></div>
    <form method="POST" class="card">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group"><label for="username">Username</label><input type="text" id="username" name="username" required autocomplete="username" autofocus></div>
        <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" required autocomplete="current-password"></div>
        <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
    <a href="/" class="back-link">&larr; Back to home</a>
</div>
{% endblock %}
