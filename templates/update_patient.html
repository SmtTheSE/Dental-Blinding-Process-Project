{% extends "base.html" %}
{% block title %}Edit patient — UDMM Research Workspace{% endblock %}
{% block content %}
<div class="form-page">
    <div class="page-header"><div class="brand-eyebrow"><a href="{{ url_for('main.manage_patients') }}">Patients</a><span class="sep">/</span><span class="mono">{{ patient.patient_id }}</span></div><h1>Edit patient</h1><p>Update record details. Blinding codes are shown for reference.</p></div>
    <form method="POST" action="{{ url_for('main.update_patient', patient_id=patient.id) }}" class="card">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group"><label for="patient-id">Patient ID</label><input id="patient-id" type="text" name="patient_id" value="{{ patient.patient_id }}" required></div>
        <div class="form-group"><label for="patient-name">Full name <span class="optional">Optional</span></label><input id="patient-name" type="text" name="name" value="{{ patient.name or '' }}" placeholder="Patient name"></div>
        <div class="field-grid"><div class="form-group"><label for="actual-age">Actual age (years)</label><input id="actual-age" type="number" step="0.1" name="actual_age" value="{{ patient.actual_age }}" required></div><div class="form-group"><label for="patient-sex">Sex</label><select id="patient-sex" name="sex"><option value="male" {% if patient.sex=='male' %}selected{% endif %}>Male</option><option value="female" {% if patient.sex=='female' %}selected{% endif %}>Female</option></select></div></div>
        <div class="form-group"><label>Blinding codes</label><div class="field-grid"><div><span class="field-caption">AlQahtani</span><input type="text" value="{{ patient.code_a or '—' }}" aria-label="AlQahtani code" disabled></div><div><span class="field-caption">Demirjian</span><input type="text" value="{{ patient.code_b or '—' }}" aria-label="Demirjian code" disabled></div></div></div>
        <div class="form-actions"><a href="{{ url_for('main.manage_patients') }}" class="btn">Cancel</a><button type="submit" class="btn btn-primary">Save changes</button></div>
    </form>
</div>
{% endblock %}
