{% extends "base.html" %}

{% block title %}Upload OPG — UDMM Research Workspace{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <div class="brand-eyebrow"><a href="{{ url_for('main.manage_patients') }}">Patients</a><span class="sep">/</span><span class="mono">{{ patient.patient_id }}</span></div>
        <h1>Upload OPG</h1>
        <p>Attach a panoramic radiograph to this patient record.</p>
    </div>

    <form method="POST" action="{{ url_for('main.upload_opg', patient_id=patient.id) }}" enctype="multipart/form-data"
        class="card">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-group">
            <label for="opg_file">OPG image</label>
            <p class="field-hint">JPG or PNG. Check the selected file name before uploading.</p>
            <input type="file" id="opg_file" name="opg_file" accept="image/*" required
                onchange="document.getElementById('file-name').innerText = this.files[0].name">
            <div id="file-name" class="file-name" aria-live="polite"></div>
        </div>
        <div class="form-actions"><a href="{{ url_for('main.manage_patients') }}" class="btn">Cancel</a><button type="submit" class="btn btn-primary">Upload image</button></div>
    </form>
</div>
{% endblock %}
